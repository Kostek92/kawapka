<script>
    // Micro-interaction for favorite toggle button
    const favBtn = document.getElementById('favorite-btn');
    if (favBtn) {
      favBtn.addEventListener('click', () => {
        const icon = favBtn.querySelector('.material-symbols-outlined');
        const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
        if (isFilled) {
          icon.style.fontVariationSettings = "'FILL' 0";
          icon.classList.remove('text-secondary');
          icon.classList.add('text-on-surface-variant');
        } else {
          icon.style.fontVariationSettings = "'FILL' 1";
          icon.classList.remove('text-on-surface-variant');
          icon.classList.add('text-secondary');
        }
      });
    }
